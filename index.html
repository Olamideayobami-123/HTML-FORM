<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORMS</title>
</head>
<body>
    <!-- form -->
     <form>
        <input type="text" placeholder="Put your first name">
        <input type="text" placeholder="put your last name">
        <input type="text" placeholder="put your other names">
        <input type="email" placeholder="john@example.com">
        <input type="password" placeholder="12345678">
        <input type="datetime-local">
        <input type="number" placeholder="+234.....">

        <!-- various input tags used in forms, checkbox, radio etc-->
         <h3>
            Where did you come from?
         </h3>
         <!-- checkbox  strictly built for multichoice option -->
         <input type="checkbox" name="first"> Kano
         <br>
         <input type="checkbox" name="first"> Kaduna
         <br>
         <input type="checkbox" name="first"> Osun
         <br>
         <input type="checkbox" name="first"> Enugu

         <hr>

          <h3>
            Where is your home town?
         </h3>
         <!-- radio  strictly built for one choice at a time-->
         <input type="radio" name="Ilesa"> Ilesa
         <br>
         <input type="radio" name="Ilesa"> Kaduna
         <br>
         <input type="radio" name="Ilesa"> Osun
         <br>
         <input type="radio" name="Ilesa"> Enugu

         <br>
         <hr>

         <select>
            <option value="">Select your state</option>
            <option value="">Osun state</option>
            <option value="">Kaduna State</option>
            <option value="">Imo state</option>
            <option value="">Ogun State</option>
            <option value="">Plateu State</option>
            <option value="">Benin Republic</option>
            <option value="">Niger State</option>
            <option value="">Kwara State</option>

         </select>

         


     </form>
</body>
</html>
